<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tonight's Movies</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #242433;
      --accent: #e50914;
      --accent-soft: #ff6b6b;
      --text: #e8e8f0;
      --text-muted: #9090a8;
      --pill-bg: #2a2a3d;
      --radius: 12px;
      --card-w: 260px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      padding: 2rem 2rem 1rem;
      text-align: center;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    header h1 span { color: var(--accent); }
    header p {
      margin-top: 0.4rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* ── API key banner ── */
    #key-banner {
      display: none;
      margin: 1rem auto;
      max-width: 600px;
      background: #2a1a1a;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      font-size: 0.88rem;
      color: var(--accent-soft);
      text-align: center;
    }
    #key-banner a { color: var(--accent-soft); }
    #key-banner input {
      margin-top: 0.6rem;
      width: 100%;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid #555;
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
    }
    #key-banner button {
      margin-top: 0.5rem;
      padding: 0.4rem 1.2rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* ── Mood bar ── */
    #mood-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      padding: 1.2rem 1rem;
    }
    .mood-btn {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      border: 1.5px solid var(--surface2);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mood-btn:hover {
      border-color: var(--accent-soft);
      color: var(--text);
    }
    .mood-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    /* ── Section label ── */
    #section-label {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding-bottom: 0.5rem;
    }

    /* ── Grid ── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));
      gap: 1.25rem;
      padding: 1rem 2rem 3rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ── Loading / error states ── */
    #status {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: 1rem;
    }
    .spinner {
      display: inline-block;
      width: 32px; height: 32px;
      border: 3px solid var(--surface2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.8rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: default;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    .card-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: var(--surface2);
    }
    .card-poster.no-img {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 2.5rem;
    }
    .card-body {
      padding: 0.85rem 0.9rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      flex: 1;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .card-year {
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 400;
    }
    .card-genres {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
    }
    .genre-pill {
      background: var(--pill-bg);
      color: var(--text-muted);
      font-size: 0.72rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
    }
    .card-overview {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-cast {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: auto;
      padding-top: 0.3rem;
      border-top: 1px solid var(--surface2);
    }
    .card-cast strong { color: var(--text); font-weight: 500; }

    /* ── Rating badge ── */
    .card-rating {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      border-radius: 999px;
      padding: 0.2rem 0.55rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: #ffd700;
    }
    .card-poster-wrap { position: relative; }
  </style>
</head>
<body>

<header>
  <h1>Tonight's <span>Movies</span></h1>
  <p>Tell us your mood — we'll find what to watch.</p>
</header>

<div id="key-banner">
  <p>You need a free TMDB API key to load movies.<br>
     Get one at <a href="https://www.themoviedb.org/settings/api" target="_blank">themoviedb.org/settings/api</a> — it only takes a minute.</p>
  <input id="key-input" type="text" placeholder="Paste your TMDB API key here..." />
  <br>
  <button onclick="saveKey()">Save & Load Movies</button>
</div>

<div id="mood-bar"></div>
<p id="section-label"></p>

<div id="grid">
  <div id="status"></div>
</div>

<script>
  // ── Config — paste your TMDB API key here, or use the banner above ──
  let TMDB_API_KEY = localStorage.getItem('tmdb_key') || '';
  const BASE = 'https://api.themoviedb.org/3';
  const IMG  = 'https://image.tmdb.org/t/p/w500';

  const MOODS = [
    { label: 'Happy',       emoji: '😄', genres: [35, 10751] },
    { label: 'Sad',         emoji: '😢', genres: [18] },
    { label: 'Excited',     emoji: '⚡', genres: [28, 12] },
    { label: 'Relaxed',     emoji: '😌', genres: [10749, 35] },
    { label: 'Adventurous', emoji: '🌍', genres: [12, 878] },
    { label: 'Thrilled',    emoji: '😱', genres: [53, 27] },
  ];

  let activeMood = null;

  // ── Build mood bar ──
  const moodBar = document.getElementById('mood-bar');
  MOODS.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'mood-btn';
    btn.dataset.label = m.label;
    btn.innerHTML = `<span>${m.emoji}</span> ${m.label}`;
    btn.onclick = () => selectMood(m);
    moodBar.appendChild(btn);
  });

  // ── API key banner logic ──
  function checkKey() {
    if (!TMDB_API_KEY) {
      document.getElementById('key-banner').style.display = 'block';
      setStatus('Enter your TMDB API key above to get started.');
    } else {
      document.getElementById('key-banner').style.display = 'none';
      selectMood(MOODS[2]); // default: Excited
    }
  }

  function saveKey() {
    const val = document.getElementById('key-input').value.trim();
    if (!val) return;
    TMDB_API_KEY = val;
    localStorage.setItem('tmdb_key', val);
    checkKey();
  }

  // ── Mood selection ──
  async function selectMood(mood) {
    if (!TMDB_API_KEY) return;
    activeMood = mood.label;

    document.querySelectorAll('.mood-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.label === mood.label);
    });

    document.getElementById('section-label').textContent =
      `${mood.emoji}  Movies for when you're feeling ${mood.label.toLowerCase()}`;

    setLoading();

    try {
      const ids = mood.genres.join('|');
      const res = await fetch(
        `${BASE}/discover/movie?api_key=${TMDB_API_KEY}&with_genres=${ids}&sort_by=popularity.desc&vote_count.gte=100&page=1`
      );
      if (!res.ok) throw new Error(res.status === 401 ? 'Invalid API key.' : `TMDB error ${res.status}`);
      const data = await res.json();
      const movies = data.results.slice(0, 12);

      // Fetch details + credits for each in parallel
      const details = await Promise.all(movies.map(m => fetchDetails(m.id)));
      renderGrid(details.filter(Boolean));
    } catch (err) {
      setError(err.message);
    }
  }

  async function fetchDetails(id) {
    try {
      const res = await fetch(`${BASE}/movie/${id}?api_key=${TMDB_API_KEY}&append_to_response=credits`);
      if (!res.ok) return null;
      return res.json();
    } catch { return null; }
  }

  // ── Render ──
  function renderGrid(movies) {
    const grid = document.getElementById('grid');
    if (!movies.length) {
      grid.innerHTML = '<div id="status">No movies found for this mood. Try another!</div>';
      return;
    }
    grid.innerHTML = movies.map(renderCard).join('');
  }

  function renderCard(m) {
    const year  = m.release_date ? m.release_date.slice(0, 4) : '';
    const score = m.vote_average ? m.vote_average.toFixed(1) : '';
    const cast  = (m.credits?.cast || []).slice(0, 3).map(a => a.name).join(', ');
    const genres = (m.genres || []).slice(0, 3).map(g =>
      `<span class="genre-pill">${g.name}</span>`).join('');

    const poster = m.poster_path
      ? `<img class="card-poster" src="${IMG}${m.poster_path}" alt="${esc(m.title)}" loading="lazy" />`
      : `<div class="card-poster no-img">🎬</div>`;

    return `
      <div class="card">
        <div class="card-poster-wrap">
          ${poster}
          ${score ? `<span class="card-rating">★ ${score}</span>` : ''}
        </div>
        <div class="card-body">
          <div class="card-title">${esc(m.title)} <span class="card-year">${year}</span></div>
          <div class="card-genres">${genres}</div>
          <p class="card-overview">${esc(m.overview || 'No description available.')}</p>
          ${cast ? `<div class="card-cast"><strong>Cast:</strong> ${esc(cast)}</div>` : ''}
        </div>
      </div>`;
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function setLoading() {
    document.getElementById('grid').innerHTML =
      '<div id="status"><div class="spinner"></div><br>Finding movies…</div>';
  }

  function setStatus(msg) {
    document.getElementById('grid').innerHTML = `<div id="status">${msg}</div>`;
  }

  function setError(msg) {
    document.getElementById('grid').innerHTML =
      `<div id="status" style="color:var(--accent-soft)">⚠️ ${msg}</div>`;
  }

  // ── Init ──
  checkKey();
</script>
</body>
</html>
